name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: build and ctest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config \
            libgtk-4-dev libpango1.0-dev libglib2.0-dev python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  smoke:
    name: heatmap in upstream Nextpad++
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake g++ pkg-config git curl ca-certificates \
            python3 python3-pip python3-venv \
            libgtk-4-dev libadwaita-1-dev libuchardet-dev \
            libpango1.0-dev libglib2.0-dev \
            xvfb xdotool imagemagick x11-apps dbus-x11
      - name: Heatmap smoke
        run: tools/smoke-heatmap.sh
        env:
          NPP_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/smoke-artifacts
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-heatmap-smoke
          path: smoke-artifacts/
          if-no-files-found: warn
